<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <input type="text" id="inputField" /><button onclick="generateTable()">Submit</button>
    <div id="output"></div>
  </body>
</html>
<script>
  function generateTable() {
    let inputElement = document.getElementById("inputField");
    let inputValue = inputElement.value.trim();
    let output = document.getElementById('output') 

    if (inputValue) {
      // console.log(inputValue);
      output.innerHTML = "";
      if (isNaN(inputValue)) {
        // console.log("Please enter a valid number");
        output.innerHTML = `Please enter a valid number`
      } else {
        inputValue = Number(inputValue);
        for (let i = 1; i <= 12; i++) {
        //   console.log(`${inputValue} * ${i} = ${inputValue * i}`);
        output.innerHTML += `${inputValue} * ${i} = ${inputValue * i} <br>`
        }
      }
    } else {
    //   console.log("Please enter a valid value");
      output.innerHTML = `Please enter a valid value`
    }
  }
</script>
