<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        background-color: aliceblue;
        font-family: 'Courier New', Courier, monospace;
    }
    .main{
        video{
            display: none;
        }
        border-radius: 20px;
        padding: 10px 4px;
        border: 4px solid #444;
        align-items: center;
        display: flex;
        flex-direction: column;
        width: 25%;
        margin: 20px auto 0;
        gap: 9px;
    }
    button{
        background-color: #FEA65A;
    }
    #output{
        text-align: center;
    }
    footer{
        position: fixed;
        top: 0;
        font-size: 15px;
        font-weight: 600;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        letter-spacing: -1px;
    }
</style>
<body>
    <main class="main">
        <video id="video" src="Party  Celebration.mp4" autoplay muted loop playsinline></video>
        <h1>✨LuckyGuess</h1>
        <h4>Choose a number between 1 and 10</h4>
        <input type="text" id="input">
        <button onclick="bet()">Draw Number</button>
        <div id="output"></div>
        <footer>This presentation is brought to you by Ifex</footer>
    <main>
</body>
</html>
<script>
    function bet() {
        let input = Number(document.getElementById('input').value)
        let video = document.getElementById('video')

        let randomNumber = Math.random() * 10;
        let RandomNumber = Math.floor(randomNumber + 1);
        if (input === RandomNumber) {
            video.style.display = 'block';
            output.innerHTML = `Congratulations🎉 You guessed right`
        }
        else if (document.getElementById('input').value === '' || isNaN(input)){
            output.innerHTML = `Enter a valid number`
        }
        else if(input > 10){
            video.style.display = 'none';
            output.innerHTML = `Number is not within range`
        }
        else if(input < 1){
            video.style.display = 'none';
            output.innerHTML = `Number is invalid`
        }
        else {
            video.style.display = 'none';
            output.innerHTML = `Unlucky Try Again<br>The Number Drawn is "${RandomNumber}"`
        }
    }
</script>
