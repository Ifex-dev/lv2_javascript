<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="seasonInputed" placeholder="Enter ur month here">
    <button onclick="run()">SEASON</button>
    <div id="output"></div>
</body>
<script>
    function run() {
        let season = document.getElementById('seasonInputed').value
        let output = document.getElementById('output')
        if (season === 'march' || season === 'april' || season === 'may' ) {
            output.innerHTML = `The season is spring`
        }else if (season === 'june' || season === 'july' || season === 'august') {
            output.innerHTML = `The season is summer`
        } else if (season === 'september' || season === 'october' || season === 'november') {
            output.innerHTML = `The season is Autumn`
        }else if (season === 'december' || season === 'january' || season === 'february') {
            output.innerHTML = `The season is Winter`
        } else{
            output.innerHTML = `Invalid Month`
        }
    }
</script>
</html>
