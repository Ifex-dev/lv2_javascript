<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            margin-top: 50px;
            background: #f2f2f2;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 95%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>BMI Calculator</h2>

        <input type="number" id="weight" placeholder="Weight in kg">
        <input type="number" id="height" placeholder="Height in meters (e.g 1.75)">

        <button onclick="calculateBMI()">Calculate BMI</button>

        <p id="result"></p>
    </div>

    <script>
        function calculateBMI() {
            let weight = parseFloat(document.getElementById("weight").value);
            let height = parseFloat(document.getElementById("height").value);

            if (!weight || !height) {
                document.getElementById("result").innerHTML = "Please enter weight and height";
                return;
            }

            let bmi = weight / (height * height);
            // let bmi = weight / (height **2);
            let category = "";

            if (bmi < 18.5) {
                category = "Underweight";
            } else if (bmi < 25) {
                category = "Normal weight";
            } else if (bmi < 30) {
                category = "Overweight";
            } else {
                category = "Obese";
            }

            document.getElementById("result").innerHTML =
                "Your BMI is: " + bmi.toFixed(2) + "<br>You are: " + category;
        }
    </script>

</body>
</html>
